# Publishes the site to hosttally.co.uk whenever a change is merged into main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional: FTP_DIR (folder on the server, default public_html/)
name: Deploy to hosttally.co.uk
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the FTP details are set
        env:
          S: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          ok=1
          [ -n "$S" ] || { echo "::error::FTP_SERVER is missing. Add it under Settings > Secrets and variables > Actions > Secrets tab > Repository secrets."; ok=0; }
          [ -n "$U" ] || { echo "::error::FTP_USERNAME is missing."; ok=0; }
          [ -n "$P" ] || { echo "::error::FTP_PASSWORD is missing."; ok=0; }
          [ $ok = 1 ]
      - run: npm ci || npm install
      - run: npm run build
      - name: Upload changed files by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || vars.FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/data/**
            **/config.php
